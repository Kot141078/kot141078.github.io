name: Register PASC F0 Gap-Closure Scaffold v0.1.1 site

on:
  push:
    branches:
      - "publish/pasc-f0-gap-closure-scaffold-v0.1.1-site"
    paths:
      - "publications/pasc-f0-gap-closure-scaffold-v0-1-1/**"
      - "tools/_register_pasc_gap_scaffold_site.py"
      - ".github/workflows/_register-pasc-gap-scaffold-site.yml"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/pasc-f0-gap-closure-scaffold-v0.1.1-site
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Register publication in human and machine surfaces
        run: python tools/_register_pasc_gap_scaffold_site.py

      - name: Rebuild and validate derived site layers
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_diary.py
          python tools/build_corpus.py
          python tools/build_machine_layer.py
          python tools/check_machine_readability.py

          python -m json.tool publications/pasc-f0-gap-closure-scaffold-v0-1-1/files/machine/index.json >/dev/null
          python -m json.tool publications/pasc-f0-gap-closure-scaffold-v0-1-1/files/machine/work.jsonld >/dev/null
          python -m json.tool publications/pasc-f0-gap-closure-scaffold-v0-1-1/files/machine/checksums.json >/dev/null
          python -m json.tool publications/pasc-foundation-gate-v0-1-1/files/machine/index.json >/dev/null
          python -m json.tool works-index.json >/dev/null
          python -m json.tool library-index.json >/dev/null
          python -m json.tool downloads-index.json >/dev/null
          python -m json.tool canonical-map.json >/dev/null
          python -m json.tool machine-index.json >/dev/null
          python -m json.tool scientific-corpus-index.json >/dev/null
          python -m json.tool scientific-corpus.jsonld >/dev/null
          python -m json.tool term-registry.json >/dev/null
          python -m json.tool term-registry.jsonld >/dev/null

      - name: Prove generator idempotency
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- . \
            ':(exclude)tools/_register_pasc_gap_scaffold_site.py' \
            ':(exclude).github/workflows/_register-pasc-gap-scaffold-site.yml' \
            > /tmp/first.patch

          python tools/_register_pasc_gap_scaffold_site.py
          python tools/build_diary.py
          python tools/build_corpus.py
          python tools/build_machine_layer.py
          python tools/check_machine_readability.py

          git diff --binary -- . \
            ':(exclude)tools/_register_pasc_gap_scaffold_site.py' \
            ':(exclude).github/workflows/_register-pasc-gap-scaffold-site.yml' \
            > /tmp/second.patch
          cmp /tmp/first.patch /tmp/second.patch

      - name: Commit generated indexes and discovery updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- tools/_register_pasc_gap_scaffold_site.py .github/workflows/_register-pasc-gap-scaffold-site.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Register PASC F0 Gap-Closure Scaffold v0.1.1 on site"
          git push origin HEAD:publish/pasc-f0-gap-closure-scaffold-v0.1.1-site
