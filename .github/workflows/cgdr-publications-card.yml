name: Add CGDR R1.6AN visible Publications card
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cgdr-publications-card.yml
      - tools/patch_cgdr_publications_nav_22724626.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch Publications
        run: python tools/patch_cgdr_publications_nav_22724626.py
      - name: Validate site
        run: python tools/run_machine_readability_gate.py
      - name: Commit and clean one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/cgdr-publications-card.yml
          rm -f tools/patch_cgdr_publications_nav_22724626.py
          git config user.name "Ivan Kotov"
          git config user.email "kotovivan78@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Expose CGDR R1.6AN as a visible Publications entry"
          git push origin HEAD:main
