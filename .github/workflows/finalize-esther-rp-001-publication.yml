name: Finalize ESTHER-RP-001 public indexes

on:
  push:
    paths:
      - "ESTHER_RP001_PUBLICATION_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update human and machine publication indexes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          DOI = "10.5281/zenodo.21443105"
          CONCEPT_DOI = "10.5281/zenodo.21443104"
          PAGE = "https://ivankotov.eu/publications/esther-rp-001/"
          ZENODO = "https://zenodo.org/records/21443105"
          REPO = "https://github.com/Kot141078/ester-theoretical-core"
          RELEASE = "https://github.com/Kot141078/ester-theoretical-core/releases/tag/esther-rp-001-v0.8.1"
          ARCHIVE = "ESTHER_RP001_v0_8_1_ENGLISH_DOI_RELEASE_2026-07-19.zip"
          SHA256 = "83e71e2fab938e3110293a61967a85440969d8d7eb78a69bf4c1ae40afd4a9d7"

          # Publications HTML: JSON-LD + visible card.
          path = Path("publications/index.html")
          text = path.read_text(encoding="utf-8")
          script_match = re.search(r'(<script type="application/ld\+json">\s*)(.*?)(\s*</script>)', text, re.S)
          if not script_match:
              raise SystemExit("JSON-LD block not found in publications/index.html")
          data = json.loads(script_match.group(2))
          item_list = next(node for node in data["@graph"] if node.get("@type") == "ItemList")
          items = item_list["itemListElement"]
          if not any(item.get("item", {}).get("identifier") in {DOI, f"https://doi.org/{DOI}"} for item in items):
              position = max(item.get("position", 0) for item in items) + 1
              items.append({
                  "@type": "ListItem",
                  "position": position,
                  "item": {
                      "@type": "ScholarlyArticle",
                      "name": "ESTHER-RP-001 v0.8.1: Centered Agency Under Persistent Uncertainty",
                      "url": PAGE,
                      "sameAs": [f"https://doi.org/{DOI}", ZENODO, REPO, RELEASE],
                      "identifier": f"https://doi.org/{DOI}",
                      "datePublished": "2026-07-19",
                      "version": "0.8.1",
                      "inLanguage": "en",
                      "description": "English DOI-bound working paper and bounded executable review package on causal memory, selective operational commitment, temporal witness, obligation continuity, and auditable substrate interaction."
                  }
              })
              rendered = json.dumps(data, ensure_ascii=False, indent=2)
              text = text[:script_match.start(2)] + rendered + text[script_match.end(2):]

          card_marker = '<!-- esther-rp-001-v0.8.1:card -->'
          if card_marker not in text:
              grid_marker = '<div class="card-grid">'
              first_grid = text.find(grid_marker)
              if first_grid < 0:
                  raise SystemExit("First publication card grid not found")
              insertion = first_grid + len(grid_marker)
              card = f'''
          {card_marker}
          <article class="card">
            <p class="eyebrow">DOI-backed working paper / bounded executable review package</p>
            <h3>ESTHER-RP-001 v0.8.1</h3>
            <p><strong>Centered Agency Under Persistent Uncertainty.</strong> Causal memory, selective operational commitment, temporal witness, obligation continuity, auditable substrate interaction, and a falsifiable matched-control programme.</p>
            <p class="status-note">Published <code>2026-07-19</code>. Version DOI: <a href="https://doi.org/{DOI}">{DOI}</a>. Concept DOI: <a href="https://doi.org/{CONCEPT_DOI}">{CONCEPT_DOI}</a>. Independent Windows reproduction: PASS. Sixth blind conceptual review: <code>NO_CANDIDATE_BLOCKERS_FOUND</code>. This is not human peer review and does not establish consciousness, personhood, AGI, empirical continuity, production security, or quantum necessity.</p>
            <div class="section-links">
              <a href="./esther-rp-001/">Site page</a>
              <a href="https://doi.org/{DOI}">DOI</a>
              <a href="{ZENODO}">Zenodo record</a>
              <a href="{REPO}">GitHub repository</a>
              <a href="{RELEASE}">GitHub release</a>
            </div>
          </article>
'''
              text = text[:insertion] + card + text[insertion:]
          path.write_text(text, encoding="utf-8")

          # Machine-readable works index.
          works_path = Path("works-index.json")
          works = json.loads(works_path.read_text(encoding="utf-8"))
          if not any(item.get("id") == "esther-rp-001-v0-8-1" for item in works["works"]):
              works["works"].insert(0, {
                  "id": "esther-rp-001-v0-8-1",
                  "title": "ESTHER-RP-001 v0.8.1: Centered Agency Under Persistent Uncertainty",
                  "type": "working paper and bounded executable research package",
                  "role": "causal memory / selective operational commitment / open external review",
                  "primary_url": PAGE,
                  "doi": DOI,
                  "doi_url": f"https://doi.org/{DOI}",
                  "concept_doi": CONCEPT_DOI,
                  "concept_doi_url": f"https://doi.org/{CONCEPT_DOI}",
                  "zenodo_record": ZENODO,
                  "github": REPO,
                  "release": RELEASE,
                  "date": "2026-07-19",
                  "version": "0.8.1",
                  "language": "en",
                  "archive": ARCHIVE,
                  "archive_sha256": SHA256,
                  "status": "published; human conceptual review and endpoint-rater pilot open",
                  "license_docs": "CC BY 4.0",
                  "license_code": "MIT"
              })
          works_path.write_text(json.dumps(works, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # LLM discovery surface.
          llms_path = Path("llms.txt")
          llms = llms_path.read_text(encoding="utf-8")
          llms_line = f"- ESTHER-RP-001 v0.8.1: {PAGE} — DOI https://doi.org/{DOI} — Zenodo {ZENODO} — GitHub release {RELEASE} — English DOI-bound working paper and bounded executable review package; Windows reproduction PASS; sixth blind conceptual review found no candidate blockers; human review remains open."
          if llms_line not in llms:
              marker = "Public works and evidence:\n"
              if marker not in llms:
                  raise SystemExit("llms.txt public works marker not found")
              llms = llms.replace(marker, marker + llms_line + "\n", 1)
          llms_path.write_text(llms, encoding="utf-8")

          # Sitemap.
          sitemap_path = Path("sitemap.xml")
          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {"s": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          locs = {node.text for node in root.findall("s:url/s:loc", ns)}
          if PAGE not in locs:
              url = ET.SubElement(root, "{http://www.sitemaps.org/schemas/sitemap/0.9}url")
              loc = ET.SubElement(url, "{http://www.sitemaps.org/schemas/sitemap/0.9}loc")
              loc.text = PAGE
              lastmod = ET.SubElement(url, "{http://www.sitemaps.org/schemas/sitemap/0.9}lastmod")
              lastmod.text = "2026-07-19"
          tree.write(sitemap_path, encoding="UTF-8", xml_declaration=True)

          # Publication receipt on the public site.
          receipt = {
              "schema": "ivankotov.eu.esther_rp001.publication_status.v1",
              "verdict": "PUBLISHED",
              "title": "ESTHER-RP-001: Centered Agency Under Persistent Uncertainty",
              "version": "0.8.1",
              "language": "en",
              "date_published": "2026-07-19",
              "version_doi": DOI,
              "concept_doi": CONCEPT_DOI,
              "zenodo_record": ZENODO,
              "github_repository": REPO,
              "github_release": RELEASE,
              "site_page": PAGE,
              "canonical_archive": {"file": ARCHIVE, "sha256": SHA256, "members": 116, "crc": "PASS"},
              "review_status": {
                  "windows_reproduction": "PASS",
                  "sixth_blind_conceptual_review": "NO_CANDIDATE_BLOCKERS_FOUND",
                  "human_peer_review": "OPEN"
              }
          }
          receipt_path = Path("publications/esther-rp-001/PUBLICATION_STATUS.json")
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit finalized public indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/index.html publications/esther-rp-001/PUBLICATION_STATUS.json works-index.json llms.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "Public indexes already finalized."
          else
            git commit -m "Publish ESTHER-RP-001 v0.8.1 across site indexes"
            git push
          fi
