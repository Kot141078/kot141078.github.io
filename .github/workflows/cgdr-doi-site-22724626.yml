name: CGDR DOI site binding 22724626 (one shot)
on:
  push:
    branches: [main]
    paths: [.github/workflows/cgdr-doi-site-22724626.yml]
permissions: {}
jobs:
  bind:
    if: github.repository == 'Kot141078/kot141078.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update only CGDR routing and build existing machine surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import copy, hashlib, html, json, os, re, subprocess, sys, urllib.error, urllib.request
          from pathlib import Path
          REPO='Kot141078/kot141078.github.io'
          PARENT='533da3de021363af00c028377130e8c8c12e6fc6'
          DOI='10.5281/zenodo.22724626'
          DOI_URL='https://doi.org/'+DOI
          PAGE='publications/cgdr-selected-process-r1-6an/index.html'
          CANON='https://ivankotov.eu/publications/cgdr-selected-process-r1-6an/'
          TITLE='CGDR-R1.6A Selected-Process Conformance: current-AK Source and R1.6AN Synthetic Evidence'
          AGI_COMMIT='93de42857f5057d49d7272a6be9fd2b237e8d4d2'
          BASE='https://github.com/Kot141078/advanced-global-intelligence/'
          PART='publications/cgdr-selected-process-r1-6an/'
          PACKAGE=BASE+'tree/'+AGI_COMMIT+'/'+PART+'doi-v0.1.1'
          RAW='https://raw.githubusercontent.com/Kot141078/advanced-global-intelligence/'+AGI_COMMIT+'/'+PART
          ZIP_NAME='CGDR_R1_6AN_DOI_22724626_v0_1_1_PUBLIC.zip'
          PDF_NAME='CGDR_R1_6AN_Technical_Report_v0_1_1.pdf'
          PDF=RAW+'doi-v0.1.1/'+PDF_NAME
          ARCHIVE=RAW+ZIP_NAME
          ZIP_SHA='2f299d529e22e2dfd8981ec8cd0ffa8d3a7a22d63f7f84a63c12eea2f8140e01'
          LICENSE=BASE+'blob/62cb3feb9e1336f9cf4ecf517de718975bf21ee4/'+PART+'source-v0.1/LICENSE.md'
          def check(v,message):
              if not v: raise RuntimeError(message)
          def text(p): return Path(p).read_text(encoding='utf-8')
          def write(p,s): Path(p).write_text(s,encoding='utf-8',newline='\n')
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          def dump(j): return json.dumps(j,ensure_ascii=False,indent=2)+'\n'
          def replace_once(s,a,b):
              check(s.count(a)==1,'Ambiguous text anchor: '+a[:60]); return s.replace(a,b,1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**k): raise RuntimeError('API redirect refused')
          def main():
              check(os.environ['GITHUB_REPOSITORY']==REPO and os.environ['GITHUB_REF']=='refs/heads/main','Wrong target')
              head=os.environ['GITHUB_SHA']; token=os.environ['GH_TOKEN']; opener=urllib.request.build_opener(NoRedirect())
              def api(method,path,data=None):
                  body=None if data is None else json.dumps(data,ensure_ascii=False).encode()
                  req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,data=body,method=method,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'CGDR-site-DOI/0.1.1'})
                  with opener.open(req,timeout=60) as r: raw=r.read(9_000_001)
                  check(len(raw)<=9_000_000,'API size limit'); return json.loads(raw)
              check(api('GET','/git/ref/heads/main')['object']['sha']==head,'Concurrent main change')
              hc=api('GET','/git/commits/'+head); check([x['sha'] for x in hc['parents']]==[PARENT],'Unexpected parent')
              check(blob(Path(PAGE).read_bytes())=='5d01ae137ae78d502554ee71bee22dda639d604b','CGDR page preimage changed')
              check(blob(Path('works-index.json').read_bytes())=='b4e8baac087b154a6bf63fdb8c5f3b072fb88077','Works preimage changed')
              check(blob(Path('publications/index.html').read_bytes())=='51cd148f7aca1fb99bae63b71a16a2cc8943a8e9','Publications preimage changed')
              page=text(PAGE)
              page=replace_once(page,'Source disclosure and evidence note · v0.1 · 12 September 2026','Source and synthetic evidence · v0.1.1 · 12 September 2026')
              page=replace_once(page,'No DOI or formal GitHub Release has been assigned.','DOI: <a href="'+DOI_URL+'">'+DOI+'</a>.')
              citation='\n'.join(['  <meta name="citation_title" content="'+TITLE+'">','  <meta name="citation_author" content="Ivan Kotov">','  <meta name="citation_publication_date" content="2026/09/12">','  <meta name="citation_doi" content="'+DOI+'">','  <meta name="citation_pdf_url" content="'+PDF+'">'])
              page=replace_once(page,'  <link rel="stylesheet" href="../../styles.css">',citation+'\n  <link rel="stylesheet" href="../../styles.css">')
              def patch_ld(m):
                  j=json.loads(m.group(1)); check(j.get('@id')==CANON+'#work','Wrong page JSON-LD')
                  j['headline']=TITLE; j['version']='0.1.1'; j['dateModified']='2026-09-12'; j['inLanguage']=['en','ru']
                  j['identifier']={'@type':'PropertyValue','propertyID':'DOI','value':DOI,'url':DOI_URL}
                  j['sameAs']=[DOI_URL,PACKAGE]; j['license']=LICENSE
                  j['encoding']=[{'@type':'MediaObject','encodingFormat':'application/pdf','contentUrl':PDF},{'@type':'MediaObject','encodingFormat':'application/zip','contentUrl':ARCHIVE}]
                  return '<script type="application/ld+json">\n'+dump(j)+'</script>'
              page,n=re.subn(r'<script type="application/ld\+json">\s*(.*?)\s*</script>',patch_ld,page,flags=re.S); check(n==1,'Ambiguous page metadata')
              section='''      <section class="section" id="doi-edition-22724626">
                  <div class="section-head"><p class="section-label">DOI edition · 0.1.1</p><h2>Source, report and citation</h2></div>
                  <p><strong>Ivan Kotov</strong> · ORCID <a href="https://orcid.org/0009-0009-6002-9845">0009-0009-6002-9845</a> · DOI <a href="DOI_URL">DOI_VALUE</a>.</p>
                  <p>Version 0.1.1 adds the attributed nine-page technical report, DOI citation and metadata. All 118 files of source package v0.1 remain byte-identical, including the 93 accepted current-AK files, three profile files and original evidence. This is a publication edition, not a new code version or experimental run.</p>
                  <div class="section-links"><a href="PDF_URL">Technical report PDF</a><a href="ZIP_URL">Complete public ZIP</a><a href="PACKAGE_URL">Exact GitHub edition</a><a href="CITATION_URL">Citation metadata</a></div>
                  <p>Public ZIP: 541,373 bytes; 131 files; 130 internal SHA-256 entries. Eight edition-checker tests, ten source-checker tests and eight evidence-checker tests pass. These are packaging tests, not CGDR trials.</p>
                  <pre><code>ZIP_HASH</code></pre>
                  <p class="status-note">Research verification permission applies together with the preserved component licenses. The package is not the private AN execution/custody archive, a turnkey end-to-end replication kit or a live-deployment approval.</p>
                </section>
          '''.replace('DOI_URL',DOI_URL).replace('DOI_VALUE',DOI).replace('PDF_URL',PDF).replace('ZIP_URL',ARCHIVE).replace('PACKAGE_URL',PACKAGE).replace('CITATION_URL',BASE+'blob/'+AGI_COMMIT+'/'+PART+'CITATION.cff').replace('ZIP_HASH',ZIP_SHA)
              page=replace_once(page,'      <section class="section" id="current-ak-source">',section+'      <section class="section" id="current-ak-source">')
              write(PAGE,page)
              ep='evidence/index.html'; evidence=text(ep)
              card='<article class="card" id="cgdr-r1-6an-evidence-note"><h3>CGDR R1.6AN: source and synthetic evidence</h3><p>Ivan Kotov · v0.1.1 · 12 September 2026. Complete unchanged current-AK source, a technical report and all 756 observer values. The internally accepted selected profile reports 18/18 episodes and 21/21 checkpoints, three expected local effects and zero promotions.</p><p class="status-note">Independent replication, c-specific real effect, economic value and deployment readiness remain unestablished. Diagnostic failures and inconclusive values are retained.</p><div class="section-links"><a href="'+CANON+'">Work page</a><a href="'+DOI_URL+'">'+DOI+'</a><a href="'+PACKAGE+'">Exact package</a></div></article>'
              evidence,n=re.subn(r'<article class="card" id="cgdr-r1-6an-evidence-note">.*?</article>',lambda m:card,evidence,flags=re.S); check(n==1,'Evidence card missing/ambiguous'); write(ep,evidence)
              pp='publications/index.html'; pub=text(pp); check('doi-edition-22724626' not in pub,'Duplicate publication section')
              sec='<section class="section" id="doi-edition-22724626"><div class="section-head"><p class="section-label">Software and technical evidence</p><h2>CGDR R1.6AN</h2></div><p>'+TITLE+'. Ivan Kotov, version 0.1.1, 12 September 2026. Source and report for a bounded internally accepted synthetic profile; no independent replication or real-world effect is claimed.</p><div class="section-links"><a href="'+CANON+'">Canonical work page</a><a href="'+DOI_URL+'">'+DOI+'</a><a href="'+PDF+'">Report PDF</a><a href="'+PACKAGE+'">Source and evidence</a></div></section>\n'
              pub=replace_once(pub,'    </main>',sec+'    </main>')
              def pub_ld(m):
                  j=json.loads(m.group(1)); lists=[x for x in j.get('@graph',[]) if x.get('@id')=='https://ivankotov.eu/publications/#works']; check(len(lists)==1,'Publication ItemList missing')
                  seq=lists[0]['itemListElement']; check(not any(x.get('item',{}).get('@id')==CANON+'#work' for x in seq),'Duplicate work metadata')
                  seq.append({'@type':'ListItem','position':len(seq)+1,'item':{'@type':'SoftwareSourceCode','@id':CANON+'#work','name':TITLE,'url':CANON,'identifier':DOI_URL,'version':'0.1.1','datePublished':'2026-09-12','author':{'@type':'Person','name':'Ivan Kotov','sameAs':'https://orcid.org/0009-0009-6002-9845'},'codeRepository':PACKAGE,'license':LICENSE}})
                  if 'numberOfItems' in lists[0]: lists[0]['numberOfItems']=len(seq)
                  return '<script type="application/ld+json">\n'+dump(j)+'</script>'
              pub,n=re.subn(r'<script type="application/ld\+json">\s*(.*?)\s*</script>',pub_ld,pub,flags=re.S); check(n==1,'Ambiguous publications metadata'); write(pp,pub)
              works=json.loads(text('works-index.json')); old_works=copy.deepcopy(works); wid='cgdr-selected-process-r1-6an-v0-1-1'
              check(not any(x.get('id')==wid or x.get('primary_url')==CANON for x in works['works']),'Work already indexed')
              entry={'id':wid,'title':TITLE,'type':'software','role':'bounded selected-process source and synthetic evidence','primary_url':CANON,'github':PACKAGE,'repository_path':PART+'doi-v0.1.1','commit':AGI_COMMIT,'date':'2026-09-12','version':'0.1.1','version_doi':DOI,'doi_role':'version','status':'public_source_and_internal_synthetic_evidence','languages':['en','ru'],'license':'CGDR research and verification permission; preserved component licenses','rights':LICENSE,'summary':'Unchanged current-AK source and a technical report for the internally accepted 18-episode/21-checkpoint synthetic profile. Three expected local effects, zero promotions; raw diagnostic failures retained. Publication does not supply independent replication.','archive_url':ARCHIVE,'archive_sha256':ZIP_SHA,'archive_bytes':541373,'manifest_url':RAW+'doi-v0.1.1/SHA256SUMS.txt','sha256sums_url':RAW+ZIP_NAME+'.sha256','non_claims':['No same-c identity or identity continuity','No consciousness, personhood or lawful succession','No B5 superiority or c-specific real effect','No economic value measurement','No general-stack conformance or live-deployment readiness','No independent clean-host replication','Not a turnkey full AN execution/custody archive'],'canonical_artifacts':[{'format':'PDF','filename':PDF_NAME,'media_type':'application/pdf','bytes':89151,'sha256':'a3e24048a5acfbc98af82c31c1718cdfcfb3e571750b699ff1956972bfc50d56','url':PDF}]}
              works['works'].append(entry); write('works-index.json',dump(works))
              sp='sitemap.xml'; sitemap=text(sp); check(CANON not in sitemap,'CGDR URL already in sitemap; inspect instead')
              sitemap=replace_once(sitemap,'</urlset>','  <url><loc>'+CANON+'</loc><lastmod>2026-09-12</lastmod></url>\n</urlset>'); write(sp,sitemap)
              subprocess.run([sys.executable,'tools/run_machine_readability_gate.py'],check=True,timeout=420)
              now=json.loads(text('works-index.json')); check(now['works'][:-1]==old_works['works'] and now['works'][-1]==entry,'Other works changed')
              check({k:v for k,v in now.items() if k!='works'}=={k:v for k,v in old_works.items() if k!='works'},'Other work-index metadata changed')
              allowed={PAGE,ep,pp,sp,'works-index.json','machine-index.json','scientific-corpus-index.json','scientific-corpus.jsonld','term-registry.json','term-registry.jsonld','semantic-bridges.json','public-repositories.json'}
              changed=subprocess.check_output(['git','diff','--name-only','-z']).decode().strip('\0').split('\0')
              check(set(changed)<=(allowed) and {PAGE,ep,pp,sp,'works-index.json','scientific-corpus-index.json','scientific-corpus.jsonld'}<=set(changed),'Unexpected generated changes: '+repr(changed))
              check(not subprocess.check_output(['git','ls-files','--others','--exclude-standard']).strip(),'Unexpected untracked files')
              rows=[]
              for p in changed:
                  check(Path(p).is_file() and not Path(p).is_symlink(),'Missing or symlink output')
                  rows.append({'path':p,'mode':'100644','type':'blob','content':text(p)})
              check(api('GET','/git/ref/heads/main')['object']['sha']==head,'Concurrent main before commit')
              tree=api('POST','/git/trees',{'base_tree':hc['tree']['sha'],'tree':rows})
              commit=api('POST','/git/commits',{'message':'Bind CGDR DOI 10.5281/zenodo.22724626 to work page, Publications, Evidence, sitemap and generated corpus indexes','tree':tree['sha'],'parents':[head]})
              diff=api('GET','/compare/'+head+'...'+commit['sha']); check({x['filename'] for x in diff['files']}==set(changed) and all(x['status']=='modified' for x in diff['files']),'Unexpected commit diff')
              check(api('GET','/git/ref/heads/main')['object']['sha']==head,'Concurrent main before promotion')
              check(api('PATCH','/git/refs/heads/main',{'sha':commit['sha'],'force':False})['object']['sha']==commit['sha'],'Promotion failed')
              for p in changed:
                  meta=api('GET','/contents/'+p+'?ref='+commit['sha']); check(meta['sha']==blob(Path(p).read_bytes()),'Readback mismatch: '+p)
              print(json.dumps({'status':'PASS_CGDR_DOI_SITE_ROUTING','commit':commit['sha'],'doi':DOI,'paths':changed,'full_existing_machine_gate':'PASS','other_works_preserved':len(old_works['works']),'research_runtime_executed':False,'zenodo_form_submitted':False},indent=2))
          try: main()
          except urllib.error.HTTPError as e:
              print('STOP_SITE_HTTP_'+str(e.code),file=sys.stderr); sys.exit(1)
          except Exception as e:
              print('STOP_SITE: '+str(e),file=sys.stderr); sys.exit(1)
          PY
