name: One-shot MOT-c corpus synchronization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mot-c-corpus-sync.yml
      - tools/sync_mot_c_publication.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synchronize MOT-c source and discovery surfaces
        run: python tools/sync_mot_c_publication.py
      - name: Rebuild generated surfaces
        run: |
          python tools/build_diary.py
          python tools/build_corpus.py
          python tools/build_machine_layer.py
      - name: Validate machine and HTML contracts
        run: python tools/check_machine_readability.py
      - name: Commit synchronized corpus surfaces
        run: |
          if git diff --quiet; then
            echo "No corpus changes required."
            exit 0
          fi
          git config user.name "Ivan Kotov"
          git config user.email "kotovivan78@gmail.com"
          git add -A
          git commit -m "Synchronize MOT-c v0.1 across public corpus indexes"
          git push origin HEAD:main
