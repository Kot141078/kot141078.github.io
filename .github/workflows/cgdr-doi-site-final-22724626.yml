name: CGDR DOI site finalizer 22724626

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cgdr-doi-site-final-22724626.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch DOI surfaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import runpy
          ns = runpy.run_path("tools/one_shot_cgdr_site_finalize_22724626.py", run_name="cgdr_site_finalizer")
          for fn in ("patch_work_page", "patch_evidence", "patch_publications", "patch_works_index", "patch_sitemap"):
              ns[fn]()
          doi = ns["DOI"]
          for path in [
              "publications/cgdr-selected-process-r1-6an/index.html",
              "evidence/index.html",
              "publications/index.html",
              "works-index.json",
          ]:
              if doi not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"missing DOI in {path}")
          if ns["CANON"] not in Path("sitemap.xml").read_text(encoding="utf-8"):
              raise SystemExit("missing canonical CGDR URL in sitemap.xml")
          print("PASS_CGDR_DOI_SITE_SOURCE_PATCH")
          PY
      - name: Rebuild and validate machine layer
        run: python tools/run_machine_readability_gate.py
      - name: Verify DOI routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          doi = "10.5281/zenodo.22724626"
          for path in [
              "publications/cgdr-selected-process-r1-6an/index.html",
              "evidence/index.html",
              "publications/index.html",
              "works-index.json",
              "scientific-corpus-index.json",
              "scientific-corpus.jsonld",
          ]:
              if doi not in Path(path).read_text(encoding="utf-8"):
                  raise SystemExit(f"missing DOI in {path}")
          canonical = "https://ivankotov.eu/publications/cgdr-selected-process-r1-6an/"
          if canonical not in Path("sitemap.xml").read_text(encoding="utf-8"):
              raise SystemExit("missing CGDR canonical URL in sitemap")
          print("PASS_CGDR_DOI_ROUTING")
          PY
      - name: Commit finalized site surfaces
        shell: bash
        run: |
          git config user.name "Ivan Kotov"
          git config user.email "kotovivan78@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish CGDR DOI 10.5281/zenodo.22724626 across site and machine discovery"
          git push origin HEAD:main
