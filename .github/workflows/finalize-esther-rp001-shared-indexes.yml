name: Finalize ESTHER-RP-001 shared indexes

on:
  push:
    paths:
      - "ESTHER_RP001_SHARED_INDEX_TRIGGER.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run deterministic index finalizer
        run: python tools/finalize_esther_rp001_indexes.py
      - name: Validate generated surfaces
        run: |
          python -m json.tool works-index.json >/dev/null
          python -m json.tool esther-rp-001.json >/dev/null
          python -m json.tool publications/esther-rp-001/PUBLICATION_STATUS.json >/dev/null
          python - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('sitemap.xml')
          print('sitemap.xml: PASS')
          PY
          grep -q "10.5281/zenodo.21443105" publications/index.html
          grep -q "10.5281/zenodo.21443105" works-index.json
          grep -q "10.5281/zenodo.21443105" llms.txt
      - name: Commit finalized indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications/index.html works-index.json llms.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "Shared indexes already current."
          else
            git commit -m "Index ESTHER-RP-001 v0.8.1 across public surfaces"
            git push
          fi
