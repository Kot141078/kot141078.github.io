name: Finalize MOT-c stable source and discovery surfaces

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mot-c-finalize-surfaces.yml
      - tools/finalize_mot_c_surfaces.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin stable source and add listing structured data
        run: python tools/finalize_mot_c_surfaces.py
      - name: Rebuild generated corpus and machine layers
        run: |
          python tools/build_diary.py
          python tools/build_corpus.py
          python tools/build_machine_layer.py
      - name: Validate machine and HTML contracts
        run: python tools/check_machine_readability.py
      - name: Commit finalized surfaces
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Ivan Kotov"
          git config user.email "kotovivan78@gmail.com"
          git add -A
          git commit -m "Finalize MOT-c stable source and crawler discovery surfaces"
          git push origin HEAD:main
