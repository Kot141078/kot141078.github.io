name: Add MOT-c visible publication card

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-mot-c-visible-publication-card.yml
      - tools/add_mot_c_visible_publication_card.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Insert visible MOT-c card
        run: python tools/add_mot_c_visible_publication_card.py
      - name: Commit publication-page update
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Ivan Kotov"
          git config user.email "kotovivan78@gmail.com"
          git add publications/index.html
          git commit -m "Expose MOT-c v0.1 in visible Publications list"
          git push origin HEAD:main
