name: Refresh PASC generated site layers

on:
  push:
    branches:
      - "publish/pasc-foundation-gate-r5-site"
    paths:
      - ".github/workflows/_refresh-pasc-generated.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/pasc-foundation-gate-r5-site
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Model the final branch without this temporary workflow
        run: rm -f .github/workflows/_refresh-pasc-generated.yml
      - name: Rebuild all generated layers
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_diary.py
          python tools/build_corpus.py
          python tools/build_machine_layer.py
          python tools/check_machine_readability.py
          python -m json.tool publications/pasc-foundation-gate-v0-1-1/files/machine/index.json >/dev/null
          python -m json.tool publications/pasc-foundation-gate-v0-1-1/files/machine/work.jsonld >/dev/null
          python -m json.tool publications/pasc-foundation-gate-v0-1-1/files/machine/checksums.json >/dev/null
      - name: Commit only the refreshed outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/_refresh-pasc-generated.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh PASC generated site layers"
          git push origin HEAD:publish/pasc-foundation-gate-r5-site
