name: Refresh workplace v0.4 machine layer
on:
  push:
    branches: [workplace-v0-4-machine-refresh-20260915]
    paths:
      - '.github/workflows/refresh-workplace-v0-4-machine-layer.yml'
permissions:
  contents: write
concurrency:
  group: workplace-v0-4-machine-refresh-${{ github.ref }}
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Regenerate and validate machine-readable outputs
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_machine_readability_gate.py
          python - <<'PY'
          import subprocess
          from pathlib import Path
          changed=[x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x]
          allowed={
            'machine-index.json',
            'scientific-corpus-index.json',
            'scientific-corpus.jsonld',
            'term-registry.json',
            'term-registry.jsonld',
            'semantic-bridges.json',
            'public-repositories.json',
            'sitemap.xml',
          }
          unexpected=sorted(set(changed)-allowed)
          assert not unexpected, f'unexpected generated changes: {unexpected}'
          required={'machine-index.json','scientific-corpus-index.json','scientific-corpus.jsonld'}
          assert required.issubset(set(changed)), f'missing expected regenerated outputs: {sorted(required-set(changed))}'
          wf=Path('.github/workflows/refresh-workplace-v0-4-machine-layer.yml')
          assert wf.exists(); wf.unlink()
          PY
          git diff --check
      - name: Commit generated outputs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/${GITHUB_REF_NAME} | awk '{print $1}')
          test "$remote" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/refresh-workplace-v0-4-machine-layer.yml machine-index.json scientific-corpus-index.json scientific-corpus.jsonld term-registry.json term-registry.jsonld semantic-bridges.json public-repositories.json sitemap.xml
          git diff --cached --check
          git commit -m 'Refresh machine indexes for workplace composition v0.4'
          git push origin HEAD:${GITHUB_REF_NAME}
