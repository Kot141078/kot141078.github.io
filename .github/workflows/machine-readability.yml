name: Machine readability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild diary projections
        run: python tools/build_diary.py
      - name: Rebuild living-corpus projections
        run: python tools/build_corpus.py
      - name: Rebuild normalized machine layer
        run: python tools/build_machine_layer.py
      - name: Validate machine and HTML contracts
        run: python tools/check_machine_readability.py
      - name: Validate generated JSON against published schemas
        run: |
          npm exec --yes --package=ajv-cli@5.0.0 --package=ajv-formats@3.0.1 -- bash -c '
            ajv validate --spec=draft2020 -c ajv-formats -s schemas/machine-index-v1.schema.json -d machine-index.json &&
            ajv validate --spec=draft2020 -c ajv-formats -s schemas/scientific-corpus-index-v1.schema.json -d scientific-corpus-index.json &&
            ajv validate --spec=draft2020 -c ajv-formats -s schemas/term-registry-v1.schema.json -d term-registry.json &&
            ajv validate --spec=draft2020 -c ajv-formats -s schemas/semantic-bridges-v1.schema.json -d semantic-bridges.json &&
            ajv validate --spec=draft2020 -c ajv-formats -s schemas/public-repositories-v1.schema.json -d public-repositories.json
          '
      - name: Reject stale generated files
        run: git diff --exit-code
