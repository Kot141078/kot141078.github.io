name: CGDR DOI site binding — exact anchor correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/cgdr-doi-site-22724626-correction.yml]
permissions: {}
jobs:
  bind:
    if: github.repository == 'Kot141078/kot141078.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply two exact corrections to the pinned publication script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, subprocess, textwrap
          origin='e0f43060bea37f61c1dac1b81ebc8e6b83583795:.github/workflows/cgdr-doi-site-22724626.yml'
          b=subprocess.check_output(['git','show',origin])
          h=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          if h!='49f444198864e4a8302a1d474daa79f2ba59667e': raise RuntimeError('Original publication script changed')
          lines=b.decode('utf-8').splitlines()
          begin=lines.index("          python3 - <<'PY'")+1
          end=lines.index('          PY',begin)
          source=textwrap.dedent('\n'.join(lines[begin:end]))+'\n'
          replacements={
              "PARENT='533da3de021363af00c028377130e8c8c12e6fc6'":"PARENT='e0f43060bea37f61c1dac1b81ebc8e6b83583795'",
              "pub=replace_once(pub,'    </main>',sec+'    </main>')":"pub=replace_once(pub,'</main>',sec+'</main>')",
          }
          for old,new in replacements.items():
              if source.count(old)!=1: raise RuntimeError('Correction anchor not unique')
              source=source.replace(old,new,1)
          # Only the Publications closing-tag whitespace and expected predecessor change.
          # Source-byte guards, complete site validation, path allowlist, concurrency guards,
          # old-work preservation and post-write byte checks are retained unchanged.
          exec(compile(source,'cgdr_doi_site_exact_anchor_correction','exec'),{'__name__':'__main__'})
          PY
